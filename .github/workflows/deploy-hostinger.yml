name: Build para Hostinger (branch hostinger)

# Gera o site estático (out/) e publica SOMENTE o conteúdo dele na branch `hostinger`,
# com o .htaccess na raiz. O Git da Hostinger (hPanel) puxa essa branch para public_html.
# O `git pull` só toca nos arquivos versionados: midias, sorteio, PHP e demais pastas
# do servidor ficam intactos.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: build-hostinger
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run verify:export

      - name: Conferir que out/ não colide com pastas do servidor
        run: |
          test -f out/.htaccess || { echo "out/.htaccess ausente"; exit 1; }
          test -f out/index.html || { echo "out/index.html ausente"; exit 1; }
          for protegida in midias sorteio; do
            if [ -e "out/$protegida" ]; then
              echo "out/$protegida não pode existir: essa pasta pertence ao servidor"; exit 1
            fi
          done

      - name: Publicar out/ na branch hostinger
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: hostinger
          publish_dir: ./out
          disable_nojekyll: true
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "build: ${{ github.sha }}"
